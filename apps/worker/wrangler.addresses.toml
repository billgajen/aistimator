# T-199: the Worker that serves businesses' own addresses (yourname.qolumns.com).
# A separate Worker from the job worker (wrangler.toml): it has no queue, no
# bucket and no database access. Code: src/addresses.ts.
#
# Local:   npx wrangler dev -c wrangler.addresses.toml --port 8799 --var ADDRESS_PROXY_KEY:<any value>
#          (the same value as ADDRESS_PROXY_KEY in apps/web/.env.local, with
#          NEXT_PUBLIC_OWN_ADDRESS_HOST=localhost:8799 there; then open http://<name>.localhost:8799/)
# Deploy:  npx wrangler deploy -c wrangler.addresses.toml --env production
# Secret:  npx wrangler secret put ADDRESS_PROXY_KEY -c wrangler.addresses.toml --env production
#          (the same value as ADDRESS_PROXY_KEY on the web app; without it the
#          Worker serves nothing and every address forwards to its quote link)
#
# The route needs a proxied DNS record for *.qolumns.com (Docs/OWNER-TODO.md,
# T-199). Cloudflare's free plan covers the record, its certificate and
# 100,000 requests a day to this Worker.
name = "qolumns-addresses"
main = "src/addresses.ts"
compatibility_date = "2024-06-01"

[observability]
enabled = true

# Development: the web app on this machine
[vars]
MAIN_ORIGIN = "http://localhost:3000"
ADDRESS_HOST = "localhost:8799"

[env.production]
name = "qolumns-addresses"
routes = [{ pattern = "*.qolumns.com/*", zone_name = "qolumns.com" }]

[env.production.vars]
MAIN_ORIGIN = "https://qolumns.com"
ADDRESS_HOST = "qolumns.com"
