name = "estimator-worker"
main = "src/index.ts"
compatibility_date = "2024-06-01"

# R2 bucket binding (for asset access)
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "aistimator-assets"

# T-178: Workers Logs, so an error in production can be read afterwards (the
# day the limiter failed every quote there was nothing to read). Logs carry
# quote ids and error names, never a customer's name, address or words.
# Kept for 7 days on Workers Paid. A deploy without this block switches the
# logs off again, whatever the dashboard says.
[observability]
enabled = true

# Development environment variables
[vars]
ENVIRONMENT = "development"

# Local dev queue (simulated by wrangler dev). The web app only uses it when
# SYNC_QUOTE_PROCESSING=false is set in apps/web/.env.local.
[[queues.producers]]
queue = "quote-jobs-local"
binding = "QUOTE_JOBS"

# max_retries: see the note at the production queue below (T-203).
[[queues.consumers]]
queue = "quote-jobs-local"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 13

# Production secrets (set via wrangler secret put):
# - SUPABASE_URL
# - SUPABASE_SERVICE_KEY
#
# Deliberately NOT set (owner's decision, T-178, AD-060): the worker's rate
# limiter stays off. With neither value there is no limiter; the website's
# limits are the brake on abuse. If they are ever set, the limiter fails open.
# - UPSTASH_REDIS_URL    (Upstash's "REST URL", https://…upstash.io)
# - UPSTASH_REDIS_TOKEN  (Upstash's "REST token")
#
# - GEMINI_API_KEY
# - ANTHROPIC_API_KEY (T-203: the overflow provider. A call still busy on Gemini after its
#   retries goes to the task's overflow model, when the task has one in ai-models.json or in
#   AI_OVERFLOW_<TASK>. Not set = overflow is off; the retries still happen.
#   `npx wrangler secret put ANTHROPIC_API_KEY --env production`)
# - AI_OVERFLOW_EXTRACTION_PASS, AI_OVERFLOW_WORDING, AI_OVERFLOW_IDENTIFICATION,
#   AI_OVERFLOW_ADJUDICATION (optional, T-203: "none" switches a task's overflow off,
#   "provider:model" names another; the defaults are in packages/shared/src/ai-models.json)
# - POSTMARK_API_TOKEN
# - POSTMARK_FROM_EMAIL
# - APP_URL (production: https://qolumns.com, T-174)
# - ALERT_EMAIL (T-189: the owner's alert address. One email per kind per hour when a quote
#   cannot be priced, the worker errors, or requests wait too long. Not set = alerts off.
#   The web app has the same setting.)
# - CLOUDFLARE_WORKER_TOKEN (same value as the web app's; required outside local dev)
# - AI_MODEL_SUPPORT_REPLY (optional, T-198: the draft reply to a report that is not a fault; same rule as the
#   two below. The Help assistant's own task, AI_MODEL_HELP_ANSWER, is the web app's.)
# - AI_MODEL_SUPPORT_SORT, AI_MODEL_FEATURE_MATCH (optional, T-197: the support inbox's two tasks. The
#   defaults are in packages/shared/src/ai-models.json; set one only to try another model. They read and
#   sort problem reports and feature requests; they never price anything.)
# - EXPO_ACCESS_TOKEN (optional, T-196: only if "enhanced security for push notifications" is
#   turned on in the Expo account; the web app has the same setting)
#
# Local checks only (ignored unless ENVIRONMENT = "development"; never set in production):
# - SECTION_AI_BASE_URL  a stand-in for the model that reads a customer's note for other
#   services (T-179). `npx wrangler dev --var SECTION_AI_BASE_URL:http://127.0.0.1:8796/note`
# - AI_STAND_IN  "off" makes the worker ask no model and use its built-in defaults, for the
#   quick checks (T-183, Docs/testing.md). `npx wrangler dev --var AI_STAND_IN:off`
# - AI_GEMINI_BASE_URL, AI_ANTHROPIC_BASE_URL  stand-ins for the two AI providers, and
#   AI_BUSY_WAITS_MS ("20,50,100") shorter waits between busy retries (T-203, verify-t203)
# - EXPO_PUSH_BASE_URL  a stand-in for Expo's push service, to read what would be sent to a
#   phone (T-196). `npx wrangler dev --var EXPO_PUSH_BASE_URL:http://127.0.0.1:8792/push`
#
# Optional rate limit overrides:
# - RATE_LIMIT_GLOBAL (default: 100)
# - RATE_LIMIT_TENANT (default: 10)

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }

# T-189: the queue check (the worker's `scheduled` handler): every 5 minutes it counts the
# requests that have waited too long and emails the owner (ALERT_EMAIL). It prices nothing.
# Production only: the local worker has no timer. Removing this block switches the check off.
[env.production.triggers]
crons = ["*/5 * * * *"]

# Inherited from the top level; repeated so it is plain that production has it
[env.production.observability]
enabled = true

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "aistimator-assets"

# Quote jobs queue (Workers Paid). The web app POSTs /trigger, the consumer
# below runs the pipeline. ONE quote per invocation: a photo-measured quote can
# take ~2.5 min, so a batch of 10 processed in series would exceed the
# consumer's wall-time limit. Parallelism comes from consumer concurrency.
# max_retries must be >= MAX_DELIVERY_RETRIES in src/queue-consumer.ts: the 3 real tries
# after the first (MAX_RETRIES) plus the 10 times a job may be put back because an AI
# provider was busy (MAX_BUSY_REQUEUES, T-203). 3 + 10 = 13. If it is lower, the queue
# dead-letters a message before the code has marked its quote failed.
# One-time setup: npx wrangler queues create quote-jobs && npx wrangler queues create quote-jobs-dlq
[[env.production.queues.producers]]
queue = "quote-jobs"
binding = "QUOTE_JOBS"

[[env.production.queues.consumers]]
queue = "quote-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 13
dead_letter_queue = "quote-jobs-dlq"

# Staging environment
[env.staging]
vars = { ENVIRONMENT = "staging" }
